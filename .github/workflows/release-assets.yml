name: release-assets

# After a release is published, download every advertised asset from GitHub
# and smoke-test it. Fails if an asset is missing, a checksum does not match,
# or the installed binary reports the wrong version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to check
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          ls -l downloaded
      - name: Verify assets and install
        run: scripts/release-check.sh "$(cat VERSION)" downloaded
