[project]
name = "embedsync-bench"
version = "0.1.0"
description = "Freshness, baseline, outage and retrieval benchmarks for postgres-embedding-sync"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
    "matplotlib>=3.10",
]

[project.scripts]
embedsync-bench = "embedsync_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedsync_bench"]

[tool.uv]
# Resolve only releases at least two weeks old for reproducible, vetted pins.
exclude-newer = "2026-11-06T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
