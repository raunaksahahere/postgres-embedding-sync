[project]
name = "embedsync-embedder"
version = "0.2.0"
description = "Local CPU embedding service for postgres-embedding-sync (sentence-transformers, pinned revisions)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.50",
    "sentence-transformers>=5.1",
    "torch>=2.9",
    "numpy>=2.1",
]

[project.scripts]
embedder = "embedder.app:main"

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.14"]
package = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedder"]

[tool.uv]
# Resolve only releases at least two weeks old for reproducible, vetted pins.
exclude-newer = "2026-11-06T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
