<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">embedsync</title>
  <desc id="d">embedsync keeps pgvector search current as PostgreSQL rows change: it follows the table through logical replication, re-embeds only what changed, and commits vectors in the same transaction as its checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08141f"/>
      <stop offset="0.55" stop-color="#0e1f3a"/>
      <stop offset="1" stop-color="#1a1647"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="130" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#word)">embedsync</text>
    <text x="76" y="190" font-size="26" fill="#cbd5e1">Keep pgvector search current as rows change</text>
    <text x="76" y="224" font-size="19" fill="#94a3b8">Logical replication in, vectors out, one transaction with the checkpoint</text>

    <!-- pipeline pills -->
    <g font-size="15" font-weight="700" letter-spacing="1">
      <rect x="76" y="254" width="104" height="34" rx="17" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8"/>
      <text x="128" y="276" text-anchor="middle" fill="#7dd3fc">STREAM</text>
      <rect x="192" y="254" width="104" height="34" rx="17" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa"/>
      <text x="244" y="276" text-anchor="middle" fill="#c4b5fd">EMBED</text>
      <rect x="308" y="254" width="116" height="34" rx="17" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e"/>
      <text x="366" y="276" text-anchor="middle" fill="#4ade80">COMMIT</text>
      <rect x="436" y="254" width="116" height="34" rx="17" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b"/>
      <text x="494" y="276" text-anchor="middle" fill="#fbbf24">MIGRATE</text>
    </g>
  </g>

  <!-- diagram: table rows -> WAL -> vectors -->
  <g transform="translate(756 78) scale(0.9)">
    <circle cx="260" cy="100" r="86" fill="url(#glow)"/>

    <!-- source table -->
    <g>
      <rect x="0" y="20" width="120" height="160" rx="12" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2"/>
      <rect x="0" y="20" width="120" height="30" rx="12" fill="#38bdf8" fill-opacity="0.22"/>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">
        <text x="14" y="40">documents</text>
      </g>
      <g fill="#94a3b8" fill-opacity="0.55">
        <rect x="14" y="64" width="92" height="9" rx="4"/>
        <rect x="14" y="86" width="70" height="9" rx="4"/>
        <rect x="14" y="108" width="84" height="9" rx="4"/>
        <rect x="14" y="130" width="60" height="9" rx="4"/>
      </g>
      <rect x="14" y="150" width="92" height="12" rx="5" fill="#fbbf24" fill-opacity="0.85"/>
    </g>

    <!-- WAL arrow -->
    <path d="M128 100H196" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#arr)"/>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="162" y="88">WAL</text>
    </g>

    <!-- embedder -->
    <g>
      <rect x="204" y="62" width="112" height="76" rx="14" fill="#241b4d" stroke="#a78bfa" stroke-width="2"/>
      <g fill="#c4b5fd">
        <circle cx="236" cy="86" r="5"/><circle cx="260" cy="86" r="5"/><circle cx="284" cy="86" r="5"/>
        <circle cx="236" cy="114" r="5" fill-opacity="0.6"/><circle cx="260" cy="114" r="5"/><circle cx="284" cy="114" r="5" fill-opacity="0.6"/>
      </g>
      <path d="M241 86L255 114M265 86L279 114M241 114L255 86M265 114L279 86" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
    </g>

    <!-- arrow to vectors -->
    <path d="M324 100H392" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- pgvector sink -->
    <g>
      <rect x="400" y="20" width="120" height="160" rx="12" fill="#0f2f2a" stroke="#22c55e" stroke-opacity="0.85" stroke-width="2"/>
      <rect x="400" y="20" width="120" height="30" rx="12" fill="#22c55e" fill-opacity="0.2"/>
      <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4ade80">
        <text x="414" y="40">pgvector</text>
      </g>
      <g fill="#86efac">
        <circle cx="430" cy="74" r="6"/><circle cx="458" cy="68" r="6"/><circle cx="486" cy="78" r="6"/>
        <circle cx="440" cy="104" r="6"/><circle cx="470" cy="112" r="6"/><circle cx="496" cy="100" r="6"/>
        <circle cx="428" cy="136" r="6"/><circle cx="456" cy="144" r="6"/><circle cx="486" cy="134" r="6"/>
      </g>
      <rect x="414" y="158" width="92" height="12" rx="5" fill="#22c55e" fill-opacity="0.8"/>
    </g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      <text x="460" y="200">vectors + checkpoint</text>
    </g>
  </g>
</svg>
